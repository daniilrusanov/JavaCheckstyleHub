# Profile "docker": used by docker-compose (SPRING_PROFILES_ACTIVE=docker).
# Hikari settings must live here, not as SPRING_DATASOURCE_HIKARI_* env vars — applying
# initialization-fail-timeout via environment after the pool starts triggers:
# "The configuration of the pool is sealed once started".

spring.datasource.hikari.initialization-fail-timeout=600000
spring.datasource.hikari.connection-timeout=120000
